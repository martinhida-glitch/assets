name: Validar ALTOQUE

on:
  push:
    branches: [main, altoque-app-v3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://kjtxkdztssbymtloafrb.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZpsIy7fSJK8Ucz6r2DwfZw_UN40LxPR
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: altoque-build-report
          path: |
            .next
            package.json
            README.md
          if-no-files-found: ignore
          retention-days: 7
