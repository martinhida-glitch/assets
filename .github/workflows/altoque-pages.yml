name: Publicar ALTOQUE

on:
  push:
    branches: [master]
    paths:
      - "altoque-site/**"
      - ".github/workflows/altoque-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: altoque-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar solo ALTOQUE
        uses: actions/checkout@v6
        with:
          sparse-checkout: altoque-site
          sparse-checkout-cone-mode: false
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: altoque-site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
